<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>担当をデビューさせる件｜BOYS PLANET裏側SNS</title>
<style>
:root{
--bg:#070d1f; --panel:#101c38; --panel2:#16264a; --panel3:#1e3262; --line:#263d6e; --line-soft:rgba(96,140,220,.28);
--txt:#eef4ff; --sub:#a3bce4; --sub2:#7e97c4; --accent:#7cc7ff; --accent-d:#3d8fd1; --accent2:#c792ff;
--pink:#ff8fb2; --danger:#ff8296; --gold:#ffd76a; --line-green:#06c755;
--shadow:0 10px 30px rgba(2,6,18,.45); --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#04081a;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;min-height:100dvh;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation}
#phone{width:100%;max-width:430px;height:100dvh;background:linear-gradient(180deg,#0c1c3e 0%,#0a1730 340px,#060f22 100%);position:relative;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:480px){#phone{height:932px;max-height:932px;border-radius:28px;border:1px solid #2a4a7f;margin:12px 0;box-shadow:0 20px 60px rgba(0,0,0,.6)}}
#sb{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 22px 4px;font-size:13px;font-weight:600;color:#dfeaff;letter-spacing:.02em;flex:0 0 auto;position:relative;min-height:34px}
#sb .island{position:absolute;left:50%;top:calc(6px + env(safe-area-inset-top));transform:translateX(-50%);width:104px;height:26px;background:#000;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
#sb .island::after{content:"";position:absolute;right:14px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:#1b2a4a;box-shadow:inset 0 0 2px #3d5a94}
#sb .sic{display:flex;align-items:center;gap:5px}
header.app-head{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;border-bottom:1px solid var(--line-soft);background:rgba(8,18,38,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
header.app-head h1{font-size:16.5px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.app-head .sub{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{background:none;border:none;color:var(--accent);font-size:26px;cursor:pointer;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin-left:-8px;border-radius:12px}
.backbtn:active{background:rgba(124,199,255,.12)}
main{flex:1;overflow-y:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:0}
main::-webkit-scrollbar{display:none}
main.noscroll{overflow:hidden}
.screen{display:none;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.screen.active{display:block;animation:scrIn.34s cubic-bezier(.22,.8,.32,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* home */
#home-hero{padding:24px 20px 6px;position:relative}
#home-hero::before{content:"";position:absolute;inset:-30px -40px auto auto;width:230px;height:230px;background:radial-gradient(circle,rgba(124,199,255,.22),transparent 65%);pointer-events:none}
#home-hero::after{content:"✦";position:absolute;right:34px;top:20px;color:rgba(199,146,255,.5);font-size:20px}
#home-hero .date{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.14em}
#home-hero h2{margin:8px 0 6px;font-size:24px;font-weight:800;line-height:1.35}
#home-hero p{color:var(--sub);font-size:13px;line-height:1.8;margin:4px 0}
#story-banner{margin:14px 16px 4px;background:linear-gradient(135deg,#155e9e,#3d5fd1 55%,#7a4fd0);border-radius:20px;padding:18px 40px 18px 18px;color:#f2f8ff;cursor:pointer;box-shadow:0 12px 28px rgba(61,95,209,.3),inset 0 1px 0 rgba(255,255,255,.25);position:relative;user-select:none}
#story-banner:active{transform:scale(.975)}
#story-banner::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-54%);font-size:30px;font-weight:300;opacity:.85}
#story-banner .t{font-weight:800;font-size:17px;text-shadow:0 1px 3px rgba(10,20,60,.4)}
#story-banner .d{font-size:12.5px;opacity:.94;margin-top:5px;line-height:1.6}
#story-banner .badge{display:inline-block;background:rgba(10,20,60,.35);border:1px solid rgba(200,230,255,.4);border-radius:999px;padding:2.5px 11px;font-size:11px;font-weight:700;margin-bottom:9px;letter-spacing:.06em}
#apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:18px 16px 6px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative;background:none;border:none;color:var(--txt);padding:2px 0;user-select:none}
.appicon .ic{width:58px;height:58px;border-radius:18px;display:block;box-shadow:0 6px 16px rgba(2,6,18,.35)}
.appicon .ic svg{width:58px;height:58px;display:block;border-radius:18px}
.appicon:active .ic{transform:scale(.9)}
.appicon span{font-size:11.5px;color:var(--sub);font-weight:500}
.appicon .bdg{position:absolute;top:-5px;right:calc(50% - 36px);background:#ff4d5e;color:#fff;font-size:10.5px;border-radius:999px;padding:1.5px 6.5px;font-weight:800;border:2px solid #0a1730;z-index:2}
#stat-strip{margin:12px 16px 0;background:linear-gradient(165deg,rgba(30,50,98,.65),rgba(16,28,56,.9));border:1px solid var(--line-soft);border-radius:18px;padding:15px 16px 13px;font-size:12px;color:var(--sub);box-shadow:var(--shadow)}
.stat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.stat-head .who{font-size:13px;color:var(--sub)}
.stat-head .who b{color:var(--txt);font-size:15px}
.star-chip{display:inline-block;background:linear-gradient(135deg,var(--gold),#e0a83e);color:#3a2a00;font-weight:800;font-size:11px;border-radius:999px;padding:2px 9px;margin-left:7px;vertical-align:1px}
.grp-chip{display:inline-block;background:linear-gradient(135deg,var(--pink),#e05a86);color:#fff;font-weight:800;font-size:11px;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:1px}
.stat-row{display:flex;align-items:center;gap:9px;margin:7px 0}
.stat-row .lb{width:52px;font-size:12px;color:var(--sub);flex:0 0 auto}
.stat-row .vl{width:30px;text-align:right;font-weight:700;color:var(--txt);font-size:13px;font-variant-numeric:tabular-nums}
.stat-foot{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line-soft);font-size:12.5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stat-foot b{color:var(--accent);font-size:14px}
.bar{height:7px;background:#081228;border-radius:99px;overflow:hidden;display:inline-block;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
/* scene */
#scene-body{padding:22px 20px 6px}
.scene-loc{display:inline-block;color:var(--accent);font-size:11.5px;font-weight:600;letter-spacing:.09em;margin-bottom:14px;background:rgba(124,199,255,.09);border:1px solid rgba(124,199,255,.25);padding:4px 11px;border-radius:999px;line-height:1.5}
.scene-text{font-size:15.5px;line-height:2.1;white-space:pre-wrap;letter-spacing:.01em}
.scene-text .who{color:var(--accent);font-weight:700}
.scene-text .kr{color:var(--sub);font-size:13px}
.big-btn{display:block;width:calc(100% - 40px);margin:18px auto 6px;padding:16px;background:linear-gradient(135deg,#4db2ff,#3d5fd1);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(61,95,209,.35),inset 0 1px 0 rgba(255,255,255,.3);letter-spacing:.03em;min-height:54px}
.big-btn:active{transform:scale(.97)}
.ghost-btn{display:block;width:calc(100% - 40px);margin:10px auto;padding:14px;background:var(--panel2);color:var(--txt);border:1px solid var(--line-soft);border-radius:14px;font-size:14px;cursor:pointer;min-height:48px}
.choice-list{padding:8px 20px}
.choice-list button{display:block;width:100%;margin:9px 0;padding:15px 16px;background:linear-gradient(160deg,#1c3464,#16294e);border:1px solid #35588f;color:var(--txt);border-radius:14px;font-size:14.5px;text-align:left;cursor:pointer;line-height:1.6;box-shadow:0 5px 14px rgba(2,6,18,.3);min-height:52px}
.choice-list button:active{background:#24406f;transform:scale(.98)}
.stage-card{margin:14px 20px 4px;background:linear-gradient(160deg,#131f42,#0c1730);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stage-card .sc-t{font-weight:800;font-size:15.5px;margin-bottom:4px}
.stage-card .sc-s{font-size:12px;color:var(--sub);margin-bottom:12px}
.score-row{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;background:rgba(124,199,255,.06);margin:6px 0;font-size:13.5px}
.score-row.win{background:rgba(255,215,106,.13);border:1px solid rgba(255,215,106,.35)}
.score-row .pts{font-weight:800;font-variant-numeric:tabular-nums}
/* light screens (LINE / Twitter / News / Instagram 2023) */
.screen.light{background:#fff;color:#111;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.screen.light .app-head{background:rgba(255,255,255,.92);border-bottom:1px solid #e6e6e6}
.screen.light .app-head h1{color:#111}
.screen.light .app-head .sub{color:#888}
.screen.light .backbtn{color:#111}
/* LINE chat */
#screen-chatlist.light{background:#fff}
.thread-l{display:flex;gap:12px;padding:12px 16px;cursor:pointer;align-items:center;min-height:72px}
.thread-l:active{background:#f2f2f2}
.thread-l .meta{flex:1;min-width:0}
.thread-l .nm{font-weight:700;font-size:15.5px;color:#111}
.thread-l .pv{color:#888;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.thread-l .tm{color:#aaa;font-size:11px}
.thread-l .ubdg{background:#ff3b30;color:#fff;font-size:10.5px;border-radius:999px;padding:1.5px 6.5px;font-weight:800}
#screen-chat.light{background:#8cabd8;display:none}
#screen-chat.active{display:flex;flex-direction:column;height:100%;padding-bottom:0}
#chat-body{padding:16px 12px 10px;display:flex;flex-direction:column;gap:11px;flex:1;overflow-y:auto;min-height:0}
.msgrow{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msgrow.me{flex-direction:row-reverse}
.msgcol{display:flex;flex-direction:column;max-width:76%}
.msgrow.me .msgcol{align-items:flex-end}
.msgname{font-size:11px;color:#fff;margin:0 2px 4px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.bubble{padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.65;background:#fff;color:#111;border-bottom-left-radius:6px;overflow-wrap:anywhere;flex:0 1 auto;box-shadow:0 2px 6px rgba(20,40,80,.18)}
.msgrow.me .bubble{background:var(--line-green);color:#fff;border-radius:18px;border-bottom-right-radius:6px}
.readmark{font-size:10px;color:#fff;opacity:.85;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.25);text-align:right;line-height:1.5}
.msgtime{font-size:10px;color:#fff;opacity:.85;margin-top:2px;align-self:flex-end;text-shadow:0 1px 2px rgba(0,0,0,.25);line-height:1.5}
.voice-bub{display:flex;align-items:center;gap:10px;min-width:158px;cursor:pointer}
.voice-bub .play{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto;color:#111}
.msgrow.me .voice-bub .play{background:rgba(255,255,255,.3);color:#fff}
.voice-bub .wave{flex:1;height:18px;background:repeating-linear-gradient(90deg,currentColor 0 2.5px,transparent 2.5px 6px);opacity:.45;border-radius:3px}
.voice-bub.playing .play{background:var(--accent-d);color:#fff}
.call-voice{margin-top:12px;width:100%}
.voice-bub.playing .wave{opacity:.85;animation:wavePulse.9s ease-in-out infinite alternate}
@keyframes wavePulse{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.sysmsg{align-self:center;background:rgba(30,50,90,.55);color:#eaf2ff;font-size:11.5px;padding:6px 13px;border-radius:999px;text-align:center;line-height:1.6;max-width:92%}
#chat-inputbar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;align-items:center;flex:0 0 auto}
#chat-fake{flex:1;background:#f2f2f7;border-radius:999px;color:#999;padding:11px 15px;font-size:16px;min-height:44px;display:flex;align-items:center}
.av{width:48px;height:48px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:#2a4a7f;border:1px solid rgba(255,255,255,.08)}
.av-init{width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2c5f8a,#7cc7ff);color:#fff;font-weight:600;font-size:19px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,"Segoe UI",sans-serif;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),inset 0 2px 2px rgba(255,255,255,.30),inset 0 -2px 3px rgba(0,0,0,.16)}
.av.sm,.av-init.sm{width:34px;height:34px;font-size:14px}
/* .grp の固定グラデーションは意図的な仕様（v2.2で最終判断）：色は個人イニシャルの名前パレットではなく番組公式のブランドグラデーション（青→紫。タイトルKV／Twitter公式BPアバターと同一値）で統一する。対象は「グループ人数表示」と公式アカウント"BP"フォールバック＝個人ではないため、質感（insetシャドウ・丸ゴシック600）は .av-init と揃えたまま色だけを公式アイデンティティとして固定する */
.av-init.grp{background:linear-gradient(165deg,#5e9bd8 0%,#155e9e 52%,#7a4fd0 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 2px 2px rgba(255,255,255,.32),inset 0 -2px 3px rgba(0,0,0,.18)}
/* twitter (2023) */
#screen-twitter{padding-bottom:0;position:relative}
#screen-twitter.active{display:flex;flex-direction:column;height:100%;padding-bottom:0}
.tw-scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tw-scroll::-webkit-scrollbar{display:none}
.tw-top{display:flex;align-items:center;gap:4px;padding:6px 8px 2px;background:rgba(255,255,255,.94);flex:0 0 auto}
.tw-top .backbtn{color:#0f1419;margin-left:-6px}
.tw-top .me-av{width:31px;height:31px;border-radius:50%;background:linear-gradient(165deg,#ffb59d 0%,#fb8659 55%,#f96a3f 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,"Segoe UI",sans-serif;line-height:1;box-shadow:inset 0 0 0 1px rgba(23,10,0,.06),inset 0 1.5px 1.5px rgba(255,255,255,.35),inset 0 -1.5px 2.5px rgba(160,50,10,.16);flex:0 0 auto}
.tw-top .bird{flex:1;display:flex;justify-content:center;color:#1d9bf0}
.tw-top .ttl{flex:1;font-weight:800;font-size:16.5px;color:#0f1419;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-top .spark{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0f1419;flex:0 0 auto}
.tw-searchbar{flex:1;background:#eff3f4;border-radius:999px;color:#536471;font-size:14px;padding:8px 14px;display:flex;gap:7px;align-items:center;margin:2px 4px}
.tw-searchbar input{flex:1;min-width:0;background:transparent;border:none;outline:none;font-size:16px;color:#0f1419;font-family:inherit;padding:0}
.tw-searchbar input::placeholder{color:#536471}
.tw-searchbar .qx{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:#1d9bf0;color:#fff;border:none;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tw-user-row{display:flex;gap:10px;align-items:center;padding:11px 16px;cursor:pointer}
.tw-user-row:active{background:#f7f9f9}
.tw-user-row .umeta{flex:1;min-width:0}
.tw-user-row .unm{font-weight:700;font-size:14.5px;color:#0f1419;display:flex;align-items:center}
.tw-user-row .uhd{color:#536471;font-size:13.5px}
.tw-replyctx{border-bottom:1px solid #eff3f4}
.tw-replyctx .ctxp{display:flex;gap:8px;padding:11px 16px 0;align-items:center;color:#536471;font-size:12.5px;min-width:0}
.tw-replyctx .ctxp .cav{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:10px;cursor:pointer;object-fit:cover;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,"Segoe UI",sans-serif;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 1px 1px rgba(255,255,255,.32),inset 0 -1px 2px rgba(0,0,0,.18)}
.tw-replyctx .ctxp .ctx-tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tw-replyctx .ctxp .ctx-to{flex:0 0 auto}
.tw-replyctx .tweet{border-bottom:none}
.tw-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px 0}
.tw-media-grid .cell{aspect-ratio:1;overflow:hidden;cursor:pointer;background:#e8eef2}
.tw-media-grid .cell img{width:100%;height:100%;object-fit:cover;display:block}
.tw-tweet-img{width:100%;border-radius:14px;margin-top:8px;border:1px solid #eff3f4;display:block;max-height:230px;object-fit:cover;object-position:top}
.tw-tabs{display:flex;background:rgba(255,255,255,.94);border-bottom:1px solid #eff3f4;flex:0 0 auto}
.tw-tabs span{flex:1;text-align:center;padding:13px 4px 0;font-size:14.5px;font-weight:700;color:#536471;cursor:pointer}
.tw-tabs span i{display:block;font-style:normal;padding-bottom:9px;border-bottom:3.5px solid transparent;border-radius:2px}
.tw-tabs span.on{color:#0f1419}
.tw-tabs span.on i{border-bottom-color:#1d9bf0}
.tw-nav{display:flex;background:#fff;border-top:1px solid #eff3f4;padding:6px 4px calc(8px + env(safe-area-inset-bottom));flex:0 0 auto;z-index:5}
.tw-nav button{flex:1;background:none;border:none;color:#536471;display:flex;align-items:center;justify-content:center;padding:5px 0;cursor:pointer;position:relative;min-height:40px}
.tw-nav button.on{color:#0f1419}
.tw-nav .nbdg{position:absolute;top:0;left:calc(50% + 1px);background:#1d9bf0;color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:.5px 5px;border:1.5px solid #fff}
.tw-fab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:#1d9bf0;border:none;color:#fff;font-size:21px;box-shadow:0 6px 18px rgba(29,155,240,.5);cursor:pointer;z-index:6;display:flex;align-items:center;justify-content:center}
.tw-fab:active{transform:scale(.93)}
.tw-fab svg{pointer-events:none}
.tw-compose{position:absolute;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}
.tw-compose.on{display:flex}
.twc-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eff3f4}
.twc-cancel{background:none;border:none;color:#1d9bf0;font-size:14.5px;cursor:pointer;padding:6px 2px}
.twc-title{flex:1;font-weight:800;font-size:16px;color:#0f1419}
.twc-post{background:#1d9bf0;color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:700;padding:7px 18px;cursor:pointer}
.twc-post:disabled{opacity:.45;cursor:default}
.twc-body{display:flex;gap:11px;padding:14px 16px;flex:1;align-items:flex-start}
.twc-body textarea{flex:1;border:none;outline:none;resize:none;font-family:inherit;font-size:17px;line-height:1.5;color:#0f1419;min-height:130px;padding-top:7px}
.twc-body textarea::placeholder{color:#536471}
.twc-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #eff3f4}
.twc-globe{flex:1;color:#1d9bf0;font-size:13px;font-weight:600}
.twc-count{font-size:13px;color:#536471;font-variant-numeric:tabular-nums}
.twc-count.warn{color:#ffad1f;font-weight:700}
.twc-count.over{color:#f4212e;font-weight:700}

.news-item p{margin:0;font-size:13px;color:#666;line-height:1.65}
.news-item .tm{font-size:11px;color:#aaa;margin-top:5px}
.news-detail{padding:18px 18px 8px}
.news-detail h2{font-size:19px;line-height:1.55;margin:6px 0 10px;color:#111}
.news-detail .body{font-size:14.5px;line-height:1.95;color:#222;white-space:pre-wrap}
/* instagram */
.ig-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #e6e6e6;background:#fff}
.ig-post{border-bottom:1px solid #e6e6e6;padding-bottom:12px}
.ig-post .ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ig-post .ph .nm{font-weight:700;font-size:14px;color:#111}
.ig-post .ph .lc{font-size:12px;color:#666}
.ig-post .img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#dde}
.ig-post .acts{padding:9px 14px 0;font-size:14px;color:#111}
.ig-post .cap{padding:3px 14px 0;font-size:13.5px;line-height:1.6;color:#111}
.ig-post .cap b{margin-right:6px}
/* mnet plus */
#screen-mnet{background:linear-gradient(180deg,#150b2e,#0a1730 60%)}
.mp-hero{margin:16px;border-radius:20px;padding:18px;background:linear-gradient(150deg,#3b1470,#7a1fa2 60%,#ad3ec2);color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mp-hero::after{content:"✦";position:absolute;right:16px;top:8px;font-size:34px;opacity:.35}
.mp-hero .lg{font-weight:900;font-size:19px;letter-spacing:.02em}
.mp-hero .ds{font-size:12px;opacity:.9;margin-top:4px;line-height:1.6}
.mp-card{margin:0 16px 14px;background:rgba(22,32,66,.92);border:1px solid rgba(199,146,255,.3);border-radius:18px;padding:16px}
.mp-card .row1{display:flex;gap:13px;align-items:center}
.mp-card .nm{font-size:17px;font-weight:800}
.mp-card .inf{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.6}
.mp-votebtn{margin-top:14px;width:100%;padding:14px;border:none;border-radius:999px;background:linear-gradient(90deg,#c792ff,#7cc7ff);color:#160b2e;font-weight:900;font-size:15px;cursor:pointer;min-height:50px}
.mp-votebtn:active{transform:scale(.98)}
.mp-votebtn.done{background:#2c3d68;color:#8fa8d8}
.mp-est{margin-top:12px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}
.mp-est b{color:var(--gold);font-size:15px}
.mp-note{font-size:11.5px;color:var(--sub2);line-height:1.7;margin-top:10px}
.mp-top9{margin:0 16px 14px}
.mp-top9 h4{margin:4px 0 10px;font-size:13px;color:var(--sub);letter-spacing:.06em}
.mp-t9row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(22,38,74,.6);margin:5px 0;font-size:13.5px}
.mp-t9row .rk{width:22px;font-weight:800;color:var(--accent)}
.mp-t9row.hero{background:rgba(255,143,178,.14);border:1px solid rgba(255,143,178,.4)}
/* support */
.sup-head{padding:18px 20px 4px}
.sup-head h3{margin:0 0 6px;font-size:17px}
.sup-head p{color:var(--sub);font-size:12.5px;line-height:1.7;margin:0}
.sup-pts{margin:12px 20px 4px;display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line-soft);border-radius:14px;padding:11px 14px;font-size:13px}
.sup-pts b{color:var(--gold);font-size:17px}
.sup-prog{height:7px;background:#081228;border-radius:99px;overflow:hidden;margin-top:8px}
.sup-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.sup-item{margin:12px 16px;background:linear-gradient(165deg,rgba(30,50,98,.55),rgba(16,28,56,.9));border:1px solid var(--line-soft);border-radius:16px;padding:14px 16px}
.sup-item .t{font-weight:700;font-size:14.5px}
.sup-item .d{font-size:12px;color:var(--sub);line-height:1.65;margin-top:4px}
.sup-ctl{display:flex;align-items:center;gap:14px;margin-top:11px}
.sup-ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel3);color:#fff;font-size:19px;cursor:pointer}
.sup-ctl button:active{transform:scale(.93)}
.sup-ctl .n{font-size:17px;font-weight:800;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.sup-ctl .ef{margin-left:auto;font-size:11.5px;color:var(--accent)}
/* rank */
.rank-hero{margin:16px 16px 6px;text-align:center}
.rank-hero .live{display:inline-block;background:#e0245e;color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 8px;letter-spacing:.1em}
.rank-hero h3{margin:9px 0 4px;font-size:19px}
.rank-hero p{color:var(--sub);font-size:12.5px;margin:0;line-height:1.7}
.rank-row{display:flex;align-items:center;gap:11px;margin:6px 16px;padding:10px 13px;background:linear-gradient(165deg,rgba(30,50,98,.5),rgba(16,28,56,.9));border:1px solid var(--line-soft);border-radius:14px;font-size:14px}
.rank-row .rk{width:34px;font-weight:900;font-size:16px;color:var(--sub);font-variant-numeric:tabular-nums}
.rank-row.top9{border-color:rgba(255,215,106,.55);background:linear-gradient(165deg,rgba(110,84,16,.45),rgba(40,32,8,.85))}
.rank-row.top9 .rk{color:var(--gold)}
.rank-row.hero{border-color:rgba(255,143,178,.65);background:linear-gradient(165deg,rgba(120,40,80,.4),rgba(50,16,40,.9))}
.rank-row .nm{font-weight:700}
.rank-row .gr{font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.gr.g{background:var(--pink);color:#fff}.gr.k{background:#57a7e8;color:#fff}
.rank-row .pts{margin-left:auto;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
.rank-row.out{opacity:.48}
.rank-zone{margin:14px 16px 4px;text-align:center;font-size:12px;color:var(--gold);letter-spacing:.08em}
/* members */
.mem-search{padding:12px 16px 4px;position:sticky;top:57px;background:rgba(8,18,38,.9);backdrop-filter:blur(10px);z-index:4}
.mem-search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:11px 15px;font-size:16px;outline:none;min-height:44px}
.mem-sec{padding:14px 16px 2px;font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 16px}
.mem-cell{text-align:center;cursor:pointer}
.mem-cell img,.mem-cell .av-init{width:100%;aspect-ratio:4/5;height:auto;border-radius:14px;object-fit:cover;font-size:26px}
.mem-cell .nm{font-size:12.5px;font-weight:700;margin-top:6px}
.mem-cell .sb2{font-size:10.5px;color:var(--sub)}
.mrow{display:flex;align-items:center;gap:11px;padding:9px 16px;cursor:pointer;font-size:14px}
.mrow .nm{font-weight:600}
.mrow .inf{margin-left:auto;font-size:11.5px;color:var(--sub);text-align:right}
/* profile */
.pf-hero{padding:22px 20px 6px;text-align:center}
.pf-hero img,.pf-hero .av-init{width:118px;height:148px;border-radius:18px;object-fit:cover;margin:0 auto;font-size:40px}
.pf-hero h3{margin:13px 0 3px;font-size:21px}
.pf-hero .yomi{color:var(--sub);font-size:12.5px}
.pf-tags{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:11px}
.pf-tags span{background:var(--panel2);border:1px solid var(--line-soft);border-radius:999px;padding:4px 11px;font-size:11.5px;color:var(--sub)}
.pf-box{margin:14px 16px;background:linear-gradient(165deg,rgba(30,50,98,.55),rgba(16,28,56,.9));border:1px solid var(--line-soft);border-radius:16px;padding:15px 16px}
.pf-box h4{margin:0 0 9px;font-size:13px;color:var(--accent);letter-spacing:.06em}
.pf-box p{margin:0;font-size:13.5px;line-height:1.9;color:var(--txt)}
.pf-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.pf-dl dt{color:var(--sub)}
.pf-dl dd{margin:0}
.skill-row{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:12.5px}
.skill-row .lb{width:58px;color:var(--sub)}
/* call */
#screen-call{padding:0;height:100%}
#screen-call.active{display:flex;flex-direction:column;height:100%;background:linear-gradient(180deg,#101c3a,#081226);animation:none}
.call-top{padding:calc(16px + env(safe-area-inset-top)) 24px 0;text-align:center;flex:0 0 auto}
.call-status{font-size:12.5px;color:var(--sub);letter-spacing:.08em}
.call-avwrap{display:flex;justify-content:center;margin-top:14px}
.call-avwrap .av,.call-avwrap .av-init{width:96px;height:96px;font-size:38px;animation:ringPulse 2.2s ease-out infinite}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(124,199,255,.45)}70%{box-shadow:0 0 0 24px rgba(124,199,255,0)}100%{box-shadow:0 0 0 0 rgba(124,199,255,0)}}
#call-name{font-size:22px;font-weight:800;margin-top:13px;text-align:center}
#call-timer{color:var(--accent);font-size:13.5px;margin-top:6px;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.04em}
#call-sub{margin:20px 22px 6px;background:rgba(10,22,42,.8);border:1px solid var(--line-soft);border-radius:18px;padding:16px;font-size:15.5px;line-height:1.95;box-shadow:var(--shadow);cursor:pointer;flex:1 1 auto;overflow-y:auto;min-height:64px}
#call-sub:active{transform:scale(.99)}
#call-sub .me-t{color:var(--gold)}
#call-choices{flex:0 0 auto;padding:0 22px}
#call-choices button{display:block;width:100%;margin:7px 0;padding:13px 15px;background:rgba(28,52,100,.85);border:1px solid #35588f;color:var(--txt);border-radius:14px;font-size:14px;text-align:left;cursor:pointer;line-height:1.55}
.call-btns{flex:0 0 auto;display:flex;justify-content:center;gap:56px;padding:14px 24px calc(18px + env(safe-area-inset-bottom))}
.call-btns .cb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--sub)}
.call-btns .cb .ic{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;font-size:22px}
#call-end{width:64px;height:64px;border-radius:50%;background:linear-gradient(160deg,#ff5d6e,#e53247);border:none;color:#fff;font-size:25px;cursor:pointer;box-shadow:0 10px 24px rgba(229,50,71,.4)}
#call-end:active{transform:scale(.92)}
#call-end svg{display:block;margin:0 auto}
/* settings / fin */
.set-row{display:flex;align-items:center;gap:10px;margin:10px 16px;background:var(--panel2);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;font-size:14px;min-height:52px}
.set-row .grow{flex:1}
.set-row button{background:var(--panel3);color:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:13px;min-height:40px}
.set-row input[type=range]{flex:1;accent-color:var(--accent)}
/* v4.23: 折りたたみトグルの状態文言・矢印の共通見た目。
   設定画面の要約（表示切替）と About「これまでの歩み」（details）の2系統で共用する */
.fold-state{color:var(--sub);font-size:12px;white-space:nowrap}
details.fold-hist>summary{list-style:none}
details.fold-hist>summary::-webkit-details-marker{display:none}
details.fold-hist>summary .fold-state::after{content:"開く ▾"}
details.fold-hist[open ]>summary .fold-state::after{content:"閉じる ▴"}
.fin-box{margin:16px;background:linear-gradient(165deg,rgba(30,50,98,.6),rgba(16,28,56,.92));border:1px solid var(--line-soft);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.fin-box h3{margin:0 0 10px;font-size:18px}
.fin-box p{font-size:13.5px;line-height:1.9;color:var(--sub);margin:6px 0}
.fin-box p b{color:var(--txt)}
.fin-rank{font-size:30px;font-weight:900;color:var(--gold);text-align:center;margin:12px 0 2px}
.fin-sub{text-align:center;color:var(--sub);font-size:12.5px;margin-bottom:8px}
/* music bar + toast */
#music-bar{position:sticky;bottom:0;left:0;right:0;background:rgba(8,18,36,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line-soft);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:7px;z-index:8}
#music-bar.on{display:flex}
#music-bar .mb-row{display:flex;align-items:center;gap:11px}
#music-bar .mb-seek{display:flex;align-items:center;gap:9px;padding:0 2px}
#music-bar .mb-seek span{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:30px}
#music-bar .mb-seek span:last-child{text-align:right}
#music-bar .mb-modes{display:flex;gap:8px;align-items:center;padding:0 2px}
#music-bar .mb-tgl{display:inline-flex;align-items:center;gap:5px;width:auto;height:auto;border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.06);border:1px solid var(--line-soft);cursor:pointer}
#music-bar .mb-tgl.on{color:#fff;border-color:var(--accent-d);background:rgba(61,143,209,.4)}
#mb-seek{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.25);outline:none;cursor:pointer;margin:0}
#mb-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
#mb-seek::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
#music-bar .note{font-size:19px;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
#music-bar .ti{flex:1;min-width:0}
#music-bar .ti .a{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#music-bar .ti .b{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#music-bar button{background:var(--panel3);border:1px solid var(--line);color:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:14px;flex:0 0 auto}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:rgba(10,22,44,.95);border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity.3s,transform.3s;z-index:60;box-shadow:var(--shadow);max-width:88%;text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* title screen (official KV style) */
#screen-title{height:100%}
#screen-title.active{display:flex;flex-direction:column;padding-bottom:0}
#screen-title .bp-title{flex:1;min-height:0}
.bp-title{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 20px calc(16px + env(safe-area-inset-bottom));background:radial-gradient(130% 72% at 50% -8%,#3b2a7a 0%,#1b2560 46%,#0a1233 78%,#060b24 100%);overflow:hidden}
.bp-stars{position:absolute;inset:0;pointer-events:none}
.bp-here{position:relative;z-index:2;letter-spacing:.55em;text-indent:.55em;font-size:11.5px;font-weight:600;color:#cfe0ff;text-transform:uppercase;margin-top:2px}
.bp-kv{position:relative;width:100%;margin-top:6px;padding:30px 0 16px}
.bp-ring{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:330px;height:330px;pointer-events:none}
.bp-logo{position:relative;z-index:2;width:302px;max-width:84vw;margin:0 auto}
.bp-logo svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 4px 24px rgba(130,150,255,.45))}
.bp-chip{position:absolute;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.8);box-shadow:0 8px 20px rgba(0,0,0,.5);z-index:3;background:#22386b}
.bp-chip img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.bp-chip.hero{border-color:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.35),0 10px 24px rgba(0,0,0,.55)}
.bp-appeal{position:relative;z-index:2;margin-top:20px;font-size:15.5px;font-weight:800;line-height:1.75;color:#eef3ff}
.bp-appeal b{color:#8fc1ff}
.bp-game{position:relative;z-index:2;margin-top:12px;display:inline-block;background:rgba(10,20,48,.65);border:1px solid rgba(150,180,255,.4);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:700;color:#dbe7ff}
.bp-desc{position:relative;z-index:2;margin-top:10px;font-size:12.5px;line-height:1.85;color:#aebadd;max-width:330px}
.bp-btns{position:relative;z-index:2;margin-top:auto;padding-top:22px;width:100%;display:flex;flex-direction:column;gap:10px}
.bp-btns .b-start{background:linear-gradient(90deg,#2f6bff,#8a3ffc);color:#fff;border:none;border-radius:14px;padding:15px;font-size:15.5px;font-weight:900;cursor:pointer;box-shadow:0 10px 26px rgba(80,80,255,.4);letter-spacing:.06em}
.bp-btns .b-cont{background:rgba(16,30,66,.6);color:#cfe0ff;border:1.5px solid rgba(160,190,255,.55);border-radius:14px;padding:13px;font-size:14.5px;font-weight:800;cursor:pointer;backdrop-filter:blur(6px)}
.bp-band{position:relative;z-index:2;margin:16px -20px -16px;width:calc(100% + 40px);background:rgba(3,6,18,.78);border-top:1px solid rgba(255,255,255,.15);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:9px;font-size:11.5px;color:#dbe6ff}
.mnet-logo{display:block;height:16px;width:auto;flex:0 0 auto}
.bp-fic{position:relative;z-index:2;margin-top:12px;font-size:10.5px;color:#7e8db3;line-height:1.7;max-width:330px}
@media (max-height:740px){.bp-logo{width:256px}.bp-ring{width:280px;height:280px}.bp-kv{padding:22px 0 10px}.bp-appeal{margin-top:14px;font-size:14px}}
@media (max-height:620px){.bp-here{display:none}.bp-logo{width:216px}.bp-ring{width:230px;height:230px}.bp-desc{display:none}.bp-kv{padding:14px 0 6px}.bp-chip{transform:scale(.82)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ==== v4.3: lock screen (iOS 16 style, 2023) ==== */
#screen-lock{height:100%}
#screen-lock.active{display:flex;flex-direction:column;padding-bottom:0}
.lock-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;color:#fff;cursor:pointer;touch-action:pan-y}
.lock-wp{position:absolute;inset:0;background-size:cover;background-position:center 18%;transform:scale(1.04)}
.lock-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,22,.34) 0%,rgba(4,8,22,.10) 30%,rgba(4,8,22,.30) 62%,rgba(3,6,16,.78) 100%)}
.lock-top{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding-top:16px;text-align:center}
.lock-ic{opacity:.95;margin-bottom:8px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
.lock-date{font-size:19px;font-weight:600;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.lock-clock{font-size:88px;font-weight:700;line-height:1.04;letter-spacing:-.01em;text-shadow:0 4px 26px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.lock-notifs{position:relative;z-index:2;margin-top:18px;padding:0 10px;display:flex;flex-direction:column;gap:8px;max-height:46%;overflow:hidden}
.lock-ntf{display:flex;gap:10px;align-items:flex-start;background:rgba(38,42,54,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:11px 13px;box-shadow:0 8px 22px rgba(0,0,0,.28);text-align:left;animation:lockNtfIn .5s ease both}
.lock-ntf:nth-child(2){animation-delay:.07s}.lock-ntf:nth-child(3){animation-delay:.14s}.lock-ntf:nth-child(4){animation-delay:.21s}
@keyframes lockNtfIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lock-ntf .nic{width:34px;height:34px;border-radius:9px;overflow:hidden;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.lock-ntf .nic svg{width:100%;height:100%;display:block}
.lock-ntf .ntx{flex:1;min-width:0}
.lock-ntf .na{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:rgba(255,255,255,.82)}
.lock-ntf .na b{color:#fff;font-weight:600}
.lock-ntf .na span{flex:0 0 auto;color:rgba(255,255,255,.66)}

{id:"nw5",at:0,src:"Kstyle",time:"2022.12.29",title:"「BOYS PLANET」シグナルソング『Here I Am』ステージ公開…センターはハンビン＆ジャン・ハオ",lead:"Mnet「BOYS PLANET」のシグナルソング『난 빛나 (Here I Am)』のステージが公開された。Kグループのセンターはソン・ハンビン、Gグループのセンターはジャン・ハオ。93人の参加者が初めて一つのステージに立った。",body:"2022年12月29日、Mnet「BOYS PLANET」のシグナルソング『난 빛나 (Here I Am)』のステージ映像が公開された。\n\nKグループのセンターはソン・ハンビン、Gグループのセンターはジャン・ハオが務め、93人の少年たちが初めて一つのステージに立った。\n\n番組の放送開始は2023年2月2日。スタークリエイターの投票によって、最終上位9人がデビューする。"},
{id:"nw1",at:0,src:"Kstyle",time:"2023.1.30",title:"「BOYS PLANET」に日プ・創造営経験者の井汲大翔が参加…3か国目のサバイバルへ",lead:"Mnet「BOYS PLANET」に、日本の「PRODUCE 101 JAPAN」、中国の「創造営2021」を経験した井汲大翔（RBW所属）が参加する。日・中・韓3か国の大型サバイバル出演は極めて異例だ。",body:"Mnetのサバイバルオーディション「BOYS PLANET」が2月2日に放送を開始する。参加者は98人から辞退者を除く93人。KグループとGグループに分かれ、最終上位9人がZEROBASEONEとしてデビューする。\n\nGグループの井汲大翔（20）は、2019年に「PRODUCE 101 JAPAN」で36位、2021年に「創造営2021」で15位という成績を残してきた。3か国語を操り、各国の現場を知る異色の経歴の持ち主だ。\n\n公式プロフィールに掲げたキーワードは「I must debut!!!!!!!」。三度目の挑戦に懸ける思いがにじむ。"},
{id:"nw6",at:0,src:"モデルプレス",time:"2023.2.1",title:"井汲大翔、モデルプレスがプロフィール特集…日プ・創造営を経た「3度目の挑戦」",lead:"モデルプレスが「BOYS PLANET」参加者のプロフィールを特集し、日本の「PRODUCE 101 JAPAN」、中国の「創造営2021」を経験した井汲大翔（20）を「3度目の挑戦」として紹介した。",body:"モデルプレスが「BOYS PLANET」の参加者プロフィールを特集し、Gグループの井汲大翔を取り上げた。\n\n大翔は2019年の「PRODUCE 101 JAPAN」で36位、2021年の「創造営2021」で15位という成績を残してきた。日・中・韓3か国の大型サバイバルに挑む異例の経歴が、早くも注目を集めている。\n\n所属はRBW。公式プロフィールに掲げたキーワードは「I must debut!!!!!!!」。2月2日の放送開始を前に、日本人参加者の中でも特に経験値の高い存在として名前が挙がっている。"},
{id:"nw7",at:4,src:"Kstyle",time:"2023.2.3",title:"「BOYS PLANET」初放送…93人の少年たち、スターレベルテストで火花",lead:"Mnet「BOYS PLANET」が2月2日に初放送を迎えた。最初の関門はスターレベルテスト。参加者が自己評価のスターを掲げ、マスター陣の審査に臨む。",body:"Mnet「BOYS PLANET」が2月2日、初回を放送した。参加者は98人から辞退者を除いた93人。KグループとGグループに分かれ、最終上位9人のデビュー枠を争う。\n\n初回のミッションはスターレベルテスト。参加者自身が付けた自己評価のスターと、マスター陣による審査結果が突き合わされる仕組みだ。\n\n日本人メンバーで組まれたチーム大阪は、BLOCK Bの「Zero For Conduct」を披露する。"},
{id:"nw8",at:5,src:"モデルプレス",time:"2023.2.9",title:"チーム大阪のスターレベルテスト、ケイタがALL STAR…井汲大翔は自己評価ALL STARから2スターに",lead:"「BOYS PLANET」スターレベルテストで、チーム大阪のケイタが唯一のALL STAR（4スター）を獲得。井汲大翔は自己評価ALL STARを掲げたが、審査結果は2スターだった。",body:"「BOYS PLANET」第2話で、チーム大阪（ケイタ、井汲大翔、ケイ、ユウト）のスターレベルテストが放送された。4人はBLOCK Bの「Zero For Conduct」を披露した。\n\n審査結果は、ケイタがALL STAR（4スター）を獲得し、大翔、ケイ、ユウトは2スター。大翔は自己評価でALL STARを掲げていただけに、悔しさの残るスタートとなった。\n\n次はシグナルソングテスト。再評価でスターがどう動くかも注目される。"},
{id:"nw2",at:6,src:"モデルプレス",time:"2023.2.10",title:"井汲大翔、シグナルソングのチッケム評価でGグループ4位に…エンディング妖精も話題",lead:"「BOYS PLANET」シグナルソング『난 빛나 (Here I Am)』の個人チッケム評価で、井汲大翔がGグループ4位に入った。センターのジャン・ハオ（7位）を上回る順位で、日本人参加者ではアントニーに次ぐ再生数を記録している。",body:"Mnet「BOYS PLANET」のシグナルソングテストの結果が公開され、個人チッケム（フォーカス動画）の高評価数ランキングで、井汲大翔がGグループ4位に入った。\n\n大翔は『M COUNTDOWN』での初披露ステージでエンディング妖精（最後のクローズアップ）を担当。指ハートから投げキスにつなげる演出が「話題になった」とモデルプレスも報じている。\n\n一方、スターレベルテストとシグナルソングテストのスター評価は2スターのまま。再評価での変動はなかった。実力評価と人気のギャップをどう埋めるかが、今後の鍵になる。"},
{id:"nw9",at:9,src:"Kstyle",time:"2023.2.16",title:"「BOYS PLANET」K対Gバトル中間チェック…VERY NICE・Gチームに厳しい指摘",lead:"K対Gグループバトルの中間チェックで、「VERY NICE」Gチームがダンスマスターのチェ・ヨンジュンから「ダンスの練習不足」を指摘された。本番までの立て直しが急務だ。",body:"「BOYS PLANET」のK対Gグループバトルに向けた中間チェックが進んでいる。SEVENTEENの「VERY NICE」で対決するGチームは、ダンスマスターのチェ・ヨンジュンから練習不足を指摘された。\n\nGチームは大翔がメンバーを指名して結成したチームで、大翔自身は最も難しいとされる高音パートも担う。中間チェックでは、その高音を最後まで決め切れない場面もあったという。\n\n本番は第4話で放送予定。同じ曲で対決するKチームとの差を、残りの練習でどこまで詰められるかが勝負になる。"},
{id:"nw3",at:11,src:"Kstyle",time:"2023.2.17",title:"「BOYS PLANET」K対Gグループバトル…VERY NICE対決はKの勝利、大翔は個人で対向に勝利",lead:"K対Gグループバトル「VERY NICE」対決は、Kグループ530点対Gグループ243点でKの勝利。大翔はキリングパートを担い、個人53点を獲得。対向ポジションのチョン・ミンギュ（39点）を上回り、マスターから「自身の魅せ方をわかっている」と評価された。",body:"「BOYS PLANET」第3話・第4話で放送されたK対Gグループバトル。SEVENTEENの「VERY NICE」対決は、Kグループが530点、Gグループが243点と大差がついた。\n\nGチームは大翔がメンバーを指名して結成したチームで、リーダーは桜樹、大翔はサブラッパー2とキリングパートを担当。中間チェックではダンスマスターのチェ・ヨンジュンから「ダンスの練習不足」を指摘され、大翔自身も最も難しい高音パートを最後まで決め切れない場面があった。\n\nそれでも本番では個人53点を獲得し、対向のサブラッパー2、チョン・ミンギュの39点を上回った。マスター陣からは「自身の魅せ方をわかっている」と高い評価も。グループバトル全体ではKグループが勝利し、ベネフィットを獲得。M COUNTDOWNスペシャルステージは「Back Door」のKチームに決まった。"},
{id:"nw10",at:14,src:"Kstyle",time:"2023.2.24",title:"「BOYS PLANET」第1回生存者発表式、今夜生中継…93人から52人へ",lead:"第1回生存者発表式が2月24日、Mnet K-POP公式YouTubeチャンネルで生中継される。スタークリエイターの投票により、93人から52人の生存者が決まる。",body:"Mnet「BOYS PLANET」の第1回生存者発表式が、2月24日に生中継される。進行はスターマスターのヨ・ジングが務める。\n\n第1回グローバル投票の結果をもとに、93人から52人が生き残る。上位陣の顔ぶれと、生存ラインぎりぎりの順位争いに注目が集まっている。\n\n井汲大翔ら日本人参加者の結果も今夜決まる。三度目の挑戦は、最初の関門を越えられるか。"},
{id:"nw4",at:15,src:"Kstyle",time:"2023.3.2",title:"「BOYS PLANET」第1回生存者発表…井汲大翔は{rank}位で生存",lead:"第1回生存者発表式（MC：ヨ・ジング）で、93人から52人の生存者が発表された。井汲大翔は{rank}位（{points}点）で生存。三度目の挑戦が、まず一つの関門を越えた。",body:"Mnet「BOYS PLANET」第5話で、第1回生存者発表式の結果が放送された。スターマスターはヨ・ジングが務め、1位はソン・ハンビン（8,343,418点）、52位の生存ラインはチョン・イチャン（345,335点）だった。\n\n井汲大翔は{rank}位（{points}点）で生存を決めた。史実の記録では21位（1,381,864点）だった順位が、この世界線では裏側のサポートによって動き始めている。\n\n次なるミッションは「デュアルポジションバトル」。生き残った52人の戦いは続く。"},
{id:"nw11",at:19,src:"Kstyle",time:"2023.3.9",title:"「BOYS PLANET」第2のミッションは「デュアルポジションバトル」…2つのポジションをこなす戦いへ",lead:"「BOYS PLANET」の第2のミッション「デュアルポジションバトル」が発表された。参加者はVOCAL＆RAP、VOCAL＆DANCE、RAP＆DANCEの3部門・全12曲から1曲を選び、2つのポジションを同時にこなすステージに挑む。",body:"Mnet「BOYS PLANET」第6話で、第2のミッション「デュアルポジションバトル」が発表された。進行はスターマスターのイ・ミニョク（BTOB）が務めた。\n\n参加者はVOCAL＆RAP、VOCAL＆DANCE、RAP＆DANCEの3部門、全12曲の中から1曲を選択。チームが定員に達している場合、上位の参加者が下位の参加者を押し出して入ることもできるルールだ。\n\n各部門の1位チームにはベネフィット10万点と『M COUNTDOWN』スペシャルステージの機会が与えられる。52人の戦いは、ここからさらに厳しくなる。"},
{id:"nw12",at:21,src:"モデルプレス",time:"2023.3.10",title:"井汲大翔、「Rush Hour」チーム結成…リッキー、拓斗ら5人でRAP＆DANCE部門に挑む",lead:"「BOYS PLANET」デュアルポジションバトルで、井汲大翔はCrushの「Rush Hour」（feat. j-hope of BTS）に挑む。チームはリッキー、豊永拓斗、マー・ジンシャン、オ・ソンミン、大翔の5人。リーダーはオ・ソンミン、キリングパートはリッキーが担う。",body:"Mnet「BOYS PLANET」のデュアルポジションバトルで、井汲大翔はRAP＆DANCE部門の「Rush Hour」を選んだ。チーム名は「Awesome Hour（어썸아워）」。\n\nメンバーは第1回発表12位のリッキー、15位の豊永拓斗、{rank}位の大翔、32位のマー・ジンシャン、34位のオ・ソンミン。リーダーは最年長のオ・ソンミンが務め、キリングパートはリッキー。大翔はサブラッパー3とサブダンサー2を担当する。\n\n前回のVERY NICEに続き、拓斗とは2ミッション連続で同じチームになった。"},
{id:"nw13",at:29,src:"Kstyle",time:"2023.3.17",title:"「BOYS PLANET」デュアルポジションバトル結果…RAP＆DANCE部門1位は「LAW」、Rush Hourは742点で4位",lead:"デュアルポジションバトルの結果が発表された。RAP＆DANCE部門は「LAW」が846点で1位となり、ベネフィット10万点と『M COUNTDOWN』スペシャルステージを獲得。大翔らの「Rush Hour」は742点で部門4位だった。",body:"Mnet「BOYS PLANET」のデュアルポジションバトルで、各部門の勝者が決まった。\n\nRAP＆DANCE部門の順位は、1位「LAW」846点、2位「ZOOM」813点、3位「GANG」798点、4位「Rush Hour」742点。1位のLAWチームはメンバー全員にベネフィット10万点と『M COUNTDOWN』スペシャルステージが与えられた。\n\n「Rush Hour」のリッキーは個人745点を記録しチーム内トップだったが、部門1位チームではないためベネフィットはなし。大翔の個人点数は公表されていない。\n\n次の関門は第2回生存者発表式。52人から28人に絞られる。"},
{id:"nw14",at:32,src:"Kstyle",time:"2023.3.24",title:"「BOYS PLANET」第2回生存者発表…井汲大翔は{rank2txt}、最後の枠を懸けた夜",lead:"第2回生存者発表式（MC：イ・ミニョク）で、52人から28人の生存者が発表された。井汲大翔は{rank2txt}（{points2}点）。史実の記録では、28位＝最後の生存枠での生存だった。",body:"Mnet「BOYS PLANET」第8話で、第2回生存者発表式の結果が放送された。スターマスターはイ・ミニョク（BTOB）が務め、1位はソン・ハンビン（7,043,213点）。第2回グローバル投票には178か国から47,586,404票が集まった。\n\n井汲大翔は{rank2txt}（{points2}点）で発表を終えた。史実の記録では、大翔は28位（1,077,299点）で、最後の1枠に滑り込む生存だった。29位はムン・ジョンヒョン（1,016,789点）で、その差はわずか60,510点だったという。\n\n{after2}"},
{id:"nw15",at:33,src:"モデルプレス",time:"2023.3.24",title:"「BOYS PLANET」第2回生存者発表、日本人はケイタ・晴翔・拓斗らが生存…28人の戦いはアーティストバトルへ",lead:"「BOYS PLANET」第2回生存者発表式で、52人から28人が生き残った。日本人参加者では寺園佳汰（8位）、前田晴翔（16位）、豊永拓斗（{takutoR2}位）が順当に生存を決めた。",body:"Mnet「BOYS PLANET」の第2回生存者発表式が放送され、52人から28人の生存者が決まった。日本人参加者では、寺園佳汰が8位（4,254,415点）、前田晴翔が16位（2,198,036点）、豊永拓斗が{takutoR2}位（1,175,739点）で生存。\n\n拓斗は番組後のインタビューで、「『Rush Hour』は大翔さんとオ・ソンミンさんがよく教えてくれた」と語ることになる。最年少の彼を支えたのは、同じチームの先輩たちだった。\n\n生き残った28人の次のミッションは、アーティストバトル。デビュー枠9席への道は、ここからが本番だ。"},
{id:"nw16",at:36,src:"Kstyle",time:"2023.3.30",title:"「BOYS PLANET」第3のミッションは「アーティストバトル」…5つの新曲を懸けた28人の戦い",lead:"「BOYS PLANET」の第3のミッション「アーティストバトル」が発表された。参加者は新曲5曲のチームに分かれ、優勝チームにはベネフィット20万点などが与えられる。",body:"Mnet「BOYS PLANET」第9話で、第3のミッション「アーティストバトル」が発表された。進行はスターマスターのキー（SHINee）が務めた。\n\n課題曲は「Switch」「SuperCharger」「Over Me」「Say My Name」「En Garde (준비, 시작!)」の新曲5曲。チーム編成はスタークリエイターの投票によって決められ、優勝チームのメンバーにはベネフィット20万点、『M COUNTDOWN』のスペシャルステージ、ミニファンミーティングの機会が与えられる。\n\n井汲大翔はファンクポップの「En Garde」チームに配属された。28人の戦いは、いよいよ最終盤に入る。"},
{id:"nw17",at:37,src:"モデルプレス",time:"2023.3.31",title:"井汲大翔は「En Garde」チームに…リーダーはイ・フェテク、キリングパートはパク・ゴヌク",lead:"「BOYS PLANET」アーティストバトルで、井汲大翔は「En Garde」チーム（En Butter）に所属。イ・フェテク、キム・ギュビン、パク・ゴヌク、クム・ジュンヒョン、イ・スンファン、大翔の6人でステージに挑む。",body:"Mnet「BOYS PLANET」のアーティストバトルで、井汲大翔は「En Garde (준비, 시작!)」のチームに決まった。チーム名は「En Butter」。\n\nメンバーは、リーダー兼メインボーカルのイ・フェテク、メインラッパーのキム・ギュビン、センター兼キリングパートのパク・ゴヌク、サブボーカル2のクム・ジュンヒョン、サブボーカル1のイ・スンファン、そしてサブラッパー1の井汲大翔の6人。\n\nこのチームは、再編成の過程で「メンバー放出のみ・追加なし」という5チーム唯一の形で固まった顔ぶれでもある。最年長のフェテクが率いるチームで、大翔の経験がどう生きるかに注目が集まる。"},
{id:"nw18",at:43,src:"Kstyle",time:"2023.4.7",title:"「BOYS PLANET」アーティストバトル結果…1位は「Over Me」、「En Garde」は597点で3位",lead:"アーティストバトルの結果が発表された。「Over Me」が621点で1位となりベネフィットを獲得。「En Garde」は597点で3位だったが、チームステージ動画の再生数は5曲中1位を記録した。",body:"Mnet「BOYS PLANET」第10話で、アーティストバトルの結果が発表された。\n\n順位は、1位「Over Me」621点、2位「Say My Name」612点、3位「En Garde」597点、4位「SuperCharger」470点、5位「Switch」432点。1位の「Over Me」チームには、ベネフィット20万点、『M COUNTDOWN』スペシャルステージ、ミニファンミーティングが与えられた。\n\n「En Garde」チーム内ではキム・ギュビンが748点でトップ。井汲大翔の個人点数は公表されていない。一方で、En Gardeのチームステージ動画は再生数162万回と5チーム中1位を記録し（4月7日時点）、大翔の個人チッケムも全体9位の9.6万回を記録した。数字の順位と、視聴者の熱量のあいだにある温度差も話題になっている。\n\n次の関門は第3回生存者発表式。28人から18人に絞られ、ファイナリストが決まる。"},
{id:"nw19",at:48,src:"Kstyle",time:"2023.4.14",title:"「BOYS PLANET」第3回生存者発表…井汲大翔は{rank3txt}",lead:"第3回生存者発表式（MC：チョン・ソミ）で、28人から18人のファイナリストが発表された。井汲大翔は{rank3txt}（{points3}点）。史実の記録では、21位での脱落だった。",body:"Mnet「BOYS PLANET」第11話で、第3回生存者発表式の結果が放送された。スターマスターはチョン・ソミが務め、1位はソン・ハンビン（5,389,363点）、18位の生存ラインはナ・カムデン（2,022,976点）だった。第3回グローバル投票には182か国から31,750,293票が集まった。\n\n井汲大翔は{rank3txt}（{points3}点）で発表を終えた。史実の記録では、大翔は21位（1,582,819点）で脱落している。18位との差は約44万点だった。\n\n{after3}"},
{id:"nw20",at:49,src:"モデルプレス",time:"2023.4.14",title:"「BOYS PLANET」ファイナリスト18人決定…決勝は「Jelly Pop」「Hot Summer」の2曲で最終決戦",lead:"「BOYS PLANET」のファイナリスト18人が決まった。ファイナルでは「Jelly Pop」と「Hot Summer」の2チームに分かれてステージを行い、生放送の投票でデビューする9人が決定する。",body:"Mnet「BOYS PLANET」のファイナルに進む18人が決まった。進行はスターマスターのキム・ジェファンが務めている。\n\nファイナルの課題曲は「Jelly Pop」と「Hot Summer」の2曲。キリングパートは、スタークリエイターの投票（動画の再生数といいね数）によって決められる仕組みだ。\n\nファイナルは4月20日、蚕室室内体育館から生放送され、新グループの名前もその場で発表される。井汲大翔ら日本人ファイナリストの結果にも注目が集まる。"},
{id:"nw21",at:55,src:"Kstyle",time:"2023.4.21",title:"「BOYS PLANET」ファイナル…ZEROBASEONEの9人決定、井汲大翔は{rankftxt}",lead:"「BOYS PLANET」のファイナルが生放送され、新グループ「ZEROBASEONE」のメンバー9人が決定した。1位はジャン・ハオ。井汲大翔は{rankftxt}（{pointsf}点）だった。",body:"Mnet「BOYS PLANET」のファイナルが4月20日、蚕室室内体育館から生放送された。進行はスターマスターのファン・ミニョンが務め、新グループの名前「ZEROBASEONE」もその場で発表された。ファイナルの総投票数は9,398,916票（184か国）。\n\n最終順位は、1位ジャン・ハオ（1,998,154点）、2位ソン・ハンビン（1,888,414点）、3位ソク・マシュー（1,702,174点）、4位リッキー（1,572,089点）、5位パク・ゴヌク（1,386,039点）、6位キム・テレ（1,349,595点）、7位キム・ギュビン（1,346,105点）、8位キム・ジウン（1,338,984点）、9位ハン・ユジン（1,196,622点）。この9人がZEROBASEONEとしてデビューする。\n\n井汲大翔は{rankftxt}（{pointsf}点）でファイナルを終えた。{afterF}\n\nZEROBASEONEは7月10日に1stミニアルバム『YOUTH IN THE SHADE』でデビューする予定だ。"}

放送が終わる頃には、その数秒のクローズアップが切り抜き動画になって、日本のSNSを駆け巡っていた。「エンディング妖精」の一言と一緒に、彼の名前は番組を追っていなかった層にまで届いていく。モデルプレスもその反響を拾い、チッケム評価Gグループ4位とあわせて報じた。

脱落した日本人メンバーたちの帰国手続きも、なおの仕事の一つだった。
央修は最後まで落ち着いていて、「大翔をよろしくお願いします」と言い残してバスに乗った。ケイ、ユウト、オウジュ、ユウキ、イチカ――それぞれの帰り道を見送るたび、残る側の重さが増していく気がした。`,

<span class="who">大翔</span>「残ったからには、ここで止まれへん。次も、見ててな」

`本番を控えた中間チェック。
En Butterはマスター陣の前で、現時点のステージを通しで披露した。

踊り終えた後の空気は、重かった。
ダンスマスターのチェ・ヨンジュンから、細部の甘さと、プロを目指す者としての姿勢について、厳しい言葉が次々に飛んだ。「この程度の完成度で、ステージに立つつもりなのか」――趣旨をかいつまめば、そういう話だった。

`控室に戻る廊下で、最初に口を開いたのはフェテクだった。
<span class="who">フェテク</span>「……反省しよう。でも、下を向く時間はない」

フェテクは時に厳しく声を上げ、時に誰よりも長く鏡の前に立った。デビューを経験した者の「当たり前」の基準が、チーム全体の基準を引き上げていく。`,

/* ================= LOCK SCREEN (v4.3) =================
   起動時はiOS 16様式のロック画面から入り、解除でタイトル画面へ進む。
   時刻は実時刻ではなく「作中日時」連動：日付は現在の場面の loc 表記を最優先し、
   無ければ到達済みのSNS／ニュース／IG投稿の最新掲載日を使う。時刻はステップ種別
   （順位発表＝放送時刻20:50／前夜通話＝深夜帯／サポート＝午前…）から決める。
   通知は進行度連動（現在のトーク／当ステップのSNS新着／Mnet Plusの投票状況／最新ニュース）。 */
function storyNow(){
const st=curStep(); let ymd=dateAtStep(S.step); /* v4.5: 日付解決を dateAtStep に共通化（解決順は従来どおり） */
if(!ymd)ymd=[2023,1,30];
const wd="日月火水木金土"[new Date(ymd[0],ymd[1]-1,ymd[2]).getDay()];
const ty=st?st.type:"scene"; let hh=20,mm=50;
if(ty==="call"){hh=23; mm=7+(S.step*7)%40;}
else if(ty==="talk"){hh=21; mm=12+(S.step*5)%40;}
else if(ty==="support"){hh=10; mm=0;}
else if(ty==="fin"||ty==="fin2"||ty==="fin3"||ty==="fin4"){hh=23; mm=42;}
else if(ty==="scene"){hh=19; mm=18+(S.step*3)%30;}
return {date:ymd[1]+"月"+ymd[2]+"日", wday:wd, time:hh+":"+String(mm).padStart(2,"0")};
}
/* v4.13: 「順位発表の直後」の判定。発表ステップの直後のフィナーレ
   （fin／fin2／fin3／fin4）のステップにいる間だけ、その発表の結果通知を出す。
   結果が確定している（部の完了フラグが立っている）場合に限る */
function lockRankVer(st){
if(!st)return 0;
if(st.type==="fin")return S.part1Done?1:0;
if(st.type==="fin2")return S.part2Done?2:0;
if(st.type==="fin3")return S.r3Done?3:0;
if(st.type==="fin4")return S.part3Done?4:0;
return 0;
}

   pri が小さいほど残る：
     0 = 発表直後の結果通知（最優先。発表の勢いを逃さない）
     1 = 現在のステップの未読トーク（物語の続きへの入口）
     2 = Mnet Plus の投票リマインダー（まだ投票できる間だけ。行動できる通知）
     3 = Twitter（現在のステップの新着ツイート）
     4 = ニュース（現在のステップの新着記事）
     5 = Mnet Plus の投票完了の確認（情報として最も軽いので、枠が足りなければ最初に落ちる）
   v4.13までは構築した順に先頭から4件を採っていたため、結果通知が入ると
   投票リマインダー（行動可能な通知）が落ちていた。v4.14では結果通知の

   汎用案内シート）に直結させる。通常この時点でカードは解放済み */
const rv=lockRankVer(st);
if(rv){
const rk=rv===1?S.heroRank:rv===2?S.heroRank2:rv===3?S.heroRank3:S.heroRankF;
/* v4.16: 文面監査。発表名は順位表側の見出し（「第◯回 生存者発表式」スペース入り／
   「ファイナル順位発表」）に合わせ、順位の言い方も順位表の「大翔の結果：」に揃える。
   順位が確定できない回（第2回・第3回で rk が null）は、順位表側と同じ「脱落圏」と表記する
   （従来は順位自体が文面から落ちていた） */
const nm=rv===4?"ファイナル順位発表":"第"+rv+"回 生存者発表式";
cand.push({pri:0,app:"rank",name:"順位表",body:nm+"の結果が出ました ― 大翔の結果："+(rk!==null&&rk!==undefined?rk+"位":"脱落圏")+"。タップで発表の思い出カードへ",go:"rankmem"+rv});

const th=(typeof THREADS!=="undefined")?THREADS[st.thread]:null;
cand.push({pri:1,app:"talk",name:"LINE",body:(th?th.title:"トーク")+"："+pv,go:"chatlist"});
}
if(S.mnetLeft>0)cand.push({pri:2,app:"mnet",name:"Mnet Plus",body:"本日の投票がまだできます（残り"+S.mnetLeft+"回）。井汲大翔への投票をお忘れなく",go:"mnet"});
const tw=TWITTER.filter(function(t){return t.at===S.step;});
if(tw.length)cand.push({pri:3,app:"twitter",name:"Twitter",body:"新しいツイートが"+tw.length+"件あります ― "+tw[0].name,go:"twitter"});
const nw=NEWS.filter(function(t){return t.at===S.step;});
if(nw.length)cand.push({pri:4,app:"news",name:nw[nw.length-1].src,body:nw[nw.length-1].title,go:"news"});
if(S.mnetLeft<=0)cand.push({pri:5,app:"mnet",name:"Mnet Plus",body:"本日の投票は完了しています（大翔への累計 "+S.mnetCast+"票）",go:"mnet"});
cand.sort(function(a,b){return a.pri-b.pri;});

if(st.type==="fin3"){renderFin3(body,ch,nx); return;}

let html='<span class="scene-loc">'+esc(st.loc||st.desc)+'</span><div class="scene-text">'+nwFill(st.pages.join("\n\n"))+"</div>";
/* v4.16: 場面内のステージカードの曲名にも種別ラベル（mbTitleHTML）を付け、バー／一覧／プレイヤー／場面カードの全経路で種別表示を揃える */
/* v4.17: 場面カードのサブ行のノートも、バーの mbNoteShort と同じ短縮形に統一する。
   曲名側の種別ラベル（公式／BGM）が「公式音源」の情報を担うため、完全形の
   「（公式音源・…）」はラベルと二重になる。失われる情報はその重複のみで、
   用途（課題曲の種別）と音源形態（長尺版／iTunesプレビュー）は短縮形にも残る。
   コンテンツタブの映像カードのメタ末尾は、情報列挙の場として完全形を維持する
   （README の表記対応表に判断を明記） */
if(st.music){const tr=TRACKS[st.music]; html+='<div class="stage-card"><div class="sc-t">♪ '+mbTitleHTML(tr)+'</div><div class="sc-s">'+esc(tr.artist)+"｜"+esc(mbNoteShort(tr))+'</div><button class="ghost-btn" style="width:100%;margin:0" onclick="playMusic(\''+st.music+'\')">▶ 再生する</button></div>';}
body.innerHTML=html;
if(st.choices&&st.choices.length){ch.innerHTML=st.choices.map(function(c,i){return '<button onclick="sceneChoice('+i+')">'+esc(c.label)+"</button>";}).join("");}

}

/* ================= v4.5: 作中日付ヘルパー／通話履歴／Mnet履歴 =================
   日付の根拠は次の範囲に限る（推測では作らない）：
   (1) ステップの loc に「YYYY年M月D日」と明記された日付。
   (2) STEP_DATES：desc に「○○発表の前日／翌日」と明記され、基準日（発表日）が
       loc に明記されているステップからの派生日。
   (3) SNSアンカー：そのステップまでに到達した Twitter／ニュース／Instagram 投稿の
       最新の掲載日（v4.3ロック画面の storyNow が「現在の作中日付」に使うのと同じ規約）。
   どれにも当たらなければ null を返し、表示は時刻のみに落とす。 */
const STEP_DATES={
14:[2023,2,23],  /* 第1回発表（2/24・step15 loc）の前日＝desc明記。思い出カードの日付とも一致 */
17:[2023,2,25],  /* 第1回発表の翌日＝desc明記 */
31:[2023,3,22],  /* 第2回発表（3/23・step32 loc）の前日＝desc明記 */
34:[2023,3,24],  /* 第2回発表の翌日＝desc明記 */
46:[2023,4,12],  /* 第3回発表（4/13・step47 loc）の前日＝desc明記 */
52:[2023,4,19]   /* ファイナル生放送（4/20・step53 loc）の前日＝desc明記 */
};
function dateAtStep(i){
const st=STEPS[i];
if(st){const m=String(st.loc||"").match(/(\d{4})年(\d{1,2})月(\d{1,2})日/)||String(st.desc||"").match(/(\d{4})年(\d{1,2})月(\d{1,2})日/); if(m)return [+m[1],+m[2],+m[3]];}
if(STEP_DATES[i])return STEP_DATES[i].slice();
let bv=-1,ymd=null;
[TWITTER,NEWS,INSTA].forEach(function(arr){(arr||[]).forEach(function(x){if(x.at<=i&&x.time){const p=String(x.time).split(".").map(Number); const v=(p[0]||2023)*10000+(p[1]||1)*100+(p[2]||1); if(v>bv){bv=v; ymd=p;}}});});
return ymd;
}
function ymdDiffDays(a,b){return Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/86400000);}
/* LINE式の相対表記：同日＝時刻／前日＝昨日／6日以内＝曜日／それ以前＝M/D（年が違えば YYYY/M/D）。
   メッセージ側・現在側のどちらかでも日付が引けない場合は時刻のみを表示する */
function lineListStamp(stepIdx,timeStr){
const md=dateAtStep(stepIdx), cd=dateAtStep(S.step);
if(!md||!cd)return timeStr;
const d=ymdDiffDays(md,cd);
if(d<=0)return timeStr;
if(d===1)return "昨日";
if(d<=6)return "日月火水木金土"[new Date(md[0],md[1]-1,md[2]).getDay()]+"曜日";
return (md[0]!==cd[0]?md[0]+"/":"")+md[1]+"/"+md[2];
}
/* そのトークステップの最終メッセージの表示時刻（renderMsgs と同じ時刻歩行で再現） */
function lastMsgTimeStr(stepIdx,threadId,msgs){
const saved=curThread; curThread=threadId;
let mins=lineBaseMin(msgs), last="";
(msgs||[]).forEach(function(m){if(m.f!=="sys"){last=lineFmtTime(mins); mins+=lineStepMin(m);}});
curThread=saved;
return last;
}

const st=STEPS[i], d=STEP_DATES[i];
const wd="日月火水木金土"[new Date(d[0],d[1]-1,d[2]).getDay()];
html+='<div class="ch-date">'+d[0]+"年"+d[1]+"月"+d[2]+"日（"+wd+"）</div>"

function mpShortDate(d){const m=String(d).match(/(\d+)年(\d+)月(\d+)日/); return m?(+m[2])+"/"+(+m[3]):String(d);}
function mpLineSVG(vals,opt){
const W=320,H=108,PL=38,PR=12,PT=15,PB=20, iw=W-PL-PR, ih=H-PT-PB;
const nums=[]; vals.forEach(function(x){if(x.v!==null&&isFinite(x.v))nums.push(x.v);});
if(nums.length<2)return "";

const X=function(i){return vals.length===1?PL+iw/2:PL+iw*i/(vals.length-1);};
const Y=function(v){const t=(v-lo)/(hi-lo); return opt.inv?(PT+t*ih):(PT+ih-t*ih);};
let s='<svg class="mp-chart-svg" viewBox="0 0 '+W+" "+H+'" aria-hidden="true">';
s+='<line x1="'+PL+'" y1="'+Y(mx).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(mx).toFixed(1)+'" stroke="rgba(255,255,255,.13)"/>';
s+='<line x1="'+PL+'" y1="'+Y(mn).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(mn).toFixed(1)+'" stroke="rgba(255,255,255,.13)"/>';
s+='<text class="mp-ax" x="'+(PL-4)+'" y="'+(Y(mx)+3).toFixed(1)+'" text-anchor="end">'+esc(opt.fmt(mx))+"</text>";
s+='<text class="mp-ax" x="'+(PL-4)+'" y="'+(Y(mn)+3).toFixed(1)+'" text-anchor="end">'+esc(opt.fmt(mn))+"</text>";
let dAttr="", pen=false;
vals.forEach(function(x,i){if(x.v===null){pen=false; return;} dAttr+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(x.v).toFixed(1)+" "; pen=true;});
if(dAttr)s+='<path d="'+dAttr+'" fill="none" stroke="'+opt.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
let firstI=-1,lastI=-1;
vals.forEach(function(x,i){if(x.v!==null){if(firstI<0)firstI=i; lastI=i;}});
vals.forEach(function(x,i){
const cx=X(i);
if(x.v===null){s+='<circle cx="'+cx.toFixed(1)+'" cy="'+(PT+ih)+'" r="3" fill="none" stroke="'+opt.color+'" stroke-width="1.3" stroke-dasharray="2 2"/>';
if(x.vote)s+='<circle cx="'+cx.toFixed(1)+'" cy="'+(PT+ih)+'" r="6.5" fill="none" stroke="#ffd76a" stroke-width="1.5" stroke-dasharray="2.5 2"/>';
if(opt.tap&&x.gi!==undefined)s+='<circle class="mp-hit" cx="'+cx.toFixed(1)+'" cy="'+(PT+ih)+'" r="11" fill="#fff" fill-opacity="0" onclick="mpEstDetail('+x.gi+')"/>';
return;}
const cy=Y(x.v);
s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3" fill="'+opt.color+'"/>';
if(x.vote)s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="6" fill="none" stroke="#ffd76a" stroke-width="1.5"/>';
if(opt.tap&&x.gi!==undefined)s+='<circle class="mp-hit" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="11" fill="#fff" fill-opacity="0" onclick="mpEstDetail('+x.gi+')"/>';
if(i===firstI||i===lastI){const ly=(cy>PT+ih/2)?cy-8:cy+14; const anch=(i===0)?"start":((i===vals.length-1)?"end":"middle"); s+='<text class="mp-vl" x="'+cx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anch+'">'+esc(opt.fmt(x.v))+"</text>";}
});
s+='<text class="mp-ax" x="'+PL+'" y="'+(H-5)+'">'+esc(vals[0].d)+"</text>";
s+='<text class="mp-ax" x="'+(W-PR)+'" y="'+(H-5)+'" text-anchor="end">'+esc(vals[vals.length-1].d)+"</text>";
return s+"</svg>";
}

/* v4.8: v4.8以降の投票は、投票確定時に記録した直前・直後の推定（bPts/bRk → aPts/aRk）で
   投票単位の動きを表示する。項目を持たない旧セーブの行は、従来の日単位の突き合わせに劣化させる */
function mpVoteMoveHTML(v){
if(typeof v.bPts==="number"&&typeof v.aPts==="number"){
const rkT=function(r){return (r===null||r===undefined)?"脱落圏":r+"位";};
const bN=(v.bRk===null||v.bRk===undefined), aN=(v.aRk===null||v.aRk===undefined);
let rp;
if(!bN&&!aN){const dd=v.bRk-v.aRk; rp=rkT(v.bRk)+" → "+rkT(v.aRk)+(dd>0?' <span class="up">▲'+dd+"</span>":dd<0?' <span class="dn">▼'+(-dd)+"</span>":" ― 変動なし");}
else if(bN&&!aN)rp='脱落圏 → '+rkT(v.aRk)+' <span class="up">▲浮上</span>';
else if(!bN&&aN)rp=rkT(v.bRk)+' → 脱落圏 <span class="dn">▼</span>';
else rp="脱落圏のまま";
const pd=v.aPts-v.bPts;
return '<span class="mv">この投票での推定の動き：'+rp+"<br>"+fmt(v.bPts)+"点 → "+fmt(v.aPts)+"点（"+(pd>0?"+"+fmt(pd):pd<0?"−"+fmt(-pd):"±0")+"点）</span>";
}
const eh=Array.isArray(S.mpEstHist)?S.mpEstHist:[];
if(!eh.length)return "";
let fi=-1, li=-1;
eh.forEach(function(e,i){if(e.d===v.d){if(fi<0)fi=i; li=i;}});
if(fi<0)return '<span class="mv-na">この日の推定記録はありません</span>';
const to=eh[li];
const rkTxt=function(r){return r===null?"脱落圏":r+"位";};
if(fi===0&&fi===li)return '<span class="mv">この日の推定：<b>'+rkTxt(to.rk)+" · "+fmt(to.pts)+"点</b>（この日の記録はこの1件のみ）</span>";
const from=fi>0?eh[fi-1]:eh[fi];
let rp;
if(from.rk!==null&&to.rk!==null){const d=from.rk-to.rk; rp=rkTxt(from.rk)+" → "+rkTxt(to.rk)+(d>0?' <span class="up">▲'+d+"</span>":d<0?' <span class="dn">▼'+(-d)+"</span>":" ―");}
else if(from.rk===null&&to.rk!==null)rp='脱落圏 → '+rkTxt(to.rk)+' <span class="up">▲浮上</span>';
else if(from.rk!==null&&to.rk===null)rp=rkTxt(from.rk)+' → 脱落圏 <span class="dn">▼</span>';
else rp="脱落圏のまま";
const pd=to.pts-from.pts;
return '<span class="mv">この日の推定の動き：'+rp+"<br>"+fmt(from.pts)+"点 → "+fmt(to.pts)+"点（"+(pd>0?"+"+fmt(pd):pd<0?"−"+fmt(-pd):"±0")+"点）</span>";
}

function memReached(){
let r=(typeof S.memMax==="number"&&S.memMax!==null)?S.memMax:-1;
(S.doneSteps||[]).forEach(function(x){if(typeof x==="number"&&x>r)r=x;});
if(S.part1Done)r=Math.max(r,16);
if(S.part2Done)r=Math.max(r,33);
if(S.r3Done)r=Math.max(r,48);
if(S.finalStarted)r=Math.max(r,53);
if(S.part3Done)r=Math.max(r,55);
return r;
}

function saveSummaryHTML(){
const part=S.part3Done?"全編完結":(S.part3Started?"第3部":(S.part2Started?"第2部":"第1部"));
const st=STEPS[S.step];

const rk=[];

+'<div style="margin:14px 16px;font-size:11.5px;color:var(--sub2);line-height:1.8">『担当をデビューさせる件』v4.42<br>本作は史実を土台にした創作フィクションです。登場人物の会話・演出は創作であり、実在の人物の発言ではありません。三部作：第1作『日プ編』、第2作『創造営編』の続編。第3部ではアーティストバトル「En Garde」と第3回生存者発表式（史実21位で脱落）、ファイナルを扱い、プレイ次第でデビュー／あと一歩の両エンディングに分岐します。なお、以下の過去の版の記述で「見込み」とあるのは、v4.15で用語を統一した現行の「推定」の旧表記です。<details class="fold-hist" style="margin:10px 0 2px"><summary style="cursor:pointer;color:var(--gold);display:flex;justify-content:space-between;align-items:center;gap:10px"><span>これまでの歩み（v4.1〜v4.34）</span><span class="fold-state"></span></summary><div style="margin-top:8px">v4.1では新規の章は追加せず、本編の既存の場面（トーク・通話・舞台裏・各フィナーレ）に、二人の距離が三部を通して少しずつ縮まっていく恋愛ラインを織り込みました。v4.2ではその接続部を監査し、第2回発表前夜の通話で彼が「言いかけた」場面を明確に植え直し、デビューエンディングの時系列の並びを整え、重なっていた文面を書き分け、ファイナル生放送に「Hot Summer」チームのステージ描写を加えました。v4.3では機能レベルの大幅改修として、起動時に2023年当時のiOS 16様式のロック画面（作中日時と進行度に連動する通知つき）を追加し、Mnet Plusの投票を「推しメン選択→確認→完了演出→見込み順位の変動表示」の体験に拡張し、各部の節目の場面カードを集める「思い出」コレクションを新設しました。いずれも史実データ・順位計算・セーブ形式（bpSaveV1、追加項目は後方互換）には影響しません。v4.4ではSNSとMnet Plusの残りの層（コンテンツのプレイヤーと個人チッケム枠、Instagramのプロフィール画面とストーリー・コメント、Twitterの通知タブとDM会話）を深掘りしました。v4.5ではLINEまわりを精緻化し、トーク一覧の日時表示を作中日付に連動させ（日付の根拠は作中の明記・発表の前日/翌日の派生・到達済み投稿の掲載日に限り、推測では作りません）、通話履歴画面を新設して到達した通話を日付ごとに振り返れるようにし、思い出コレクションに恋愛場面のカード5枚（全21枚）を追加し、Mnet Plusのマイページに作中日時つきの投票履歴と推定順位の推移（既存の推定ロジックの値を記録するだけのもの）を追加しました。v4.6では、トーク一覧を各スレッドの最終メッセージの作中日時（dateAtStepで解決できた日付）が新しい順に並べ替えるようにし（日付が解決できないスレッドは従来の定義順を保って後ろにまとめます）、通話履歴の行をタップすると対応する思い出カードの詳細を開ける導線を付け（未解放の場合は解放条件を案内します）、Mnet Plusマイページの推定推移に順位と推定ポイントの折れ線グラフ（直近12件・リストと併記）を加え、投票タブに前回投票の要約（作中日時と推しメン名）を小さく出すようにしました。v4.7では、推定推移グラフの各点をタップすると、その記録の日付・順位・ポイント・前回比をシートで表示するようにし、通話履歴の行に「読み返す」を追加して到達済みの通話の会話をそのまま閲覧専用で読み返せるようにし（実際に選んだ締めの返事は記録されていないため、当時の選択肢を両方載せます）、投票履歴の各行に、その投票日の推定順位・ポイントの動きを推定の記録との日付突き合わせで併記しました。v4.8では、通話の読み返し画面の末尾に、その通話に対応する思い出カードを開くボタンを置いて「通話履歴→読み返し→思い出」の導線を閉じ、推定推移リストの行をタップしてもグラフと同じ記録の詳細シートが開くように導線を統一し、投票履歴の推定変動を、投票確定時の直前・直後の推定を各行に記録する投票単位の前後比較に精緻化しました（旧セーブの投票記録は項目を持たないため、従来どおり日単位の表示のままです）。読み返し画面のボイス行は、通話本編の字幕内ボイスバブルと同じクラスに揃え、幅いっぱいのバーと再生状態の見た目を一致させました。いずれも史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.9では、本編の既存ステップの中に、裏取りできた当時の実在エピソードを織り込みました。シグナルソング『Here I Am』の『M COUNTDOWN』初披露で大翔が担ったエンディング妖精（指ハートからの投げキス、モデルプレス報道）の反響を場面描写とSNSで厚くし、グループバトル後には、Mnet公式の未公開映像でチョン・ミンギュと大翔が「ベスト相方（ベスト 짝꿍）」に選出された出来事（VERY NICEでは対向同士だった2人）をSNSの反応として加えました。「Rush Hour」の練習室の対立場面では、大翔が実際の話し合いで漏らした「サバイバルは3回目。これで出来なかったらアイドルはあきらめなければならない」という趣旨の発言（シネマカフェ報道）に寄せて、彼の本音のセリフを強化しています。第11話の企画ゲーム「静寂の中の叫び」で分量の少なかった大翔がレジェンド級の切り抜きを作ったというエピソードは、裏取りがファン記録の層のため、史実として断定せずファンの反応の空気感としてのみ触れています。実在のファンのハンドルや投稿文の逐語コピーはしていません。v4.10では、v4.9で織り込んだエピソードの受け皿を広げました。思い出コレクションに「ベスト相方」と「静寂の中の叫び」のテキストカードを到達連動で追加し（全23枚）、ベスト相方選出はMnet Plusのコンテンツタブに「未公開映像」カードとしても出し（楽曲ではないため再生はせず、タップで選出の内容を表示します）、投票タブからもそのカードへ進める導線を付けました。あわせて、投票タブの「前回投票」の要約にも、その投票での推定順位・ポイントの動き（v4.8以降の投票は投票単位の前後比較、それ以前は日単位の突き合わせ）を併記し、Mnet Plusマイページの推定推移グラフでは、投票した日に記録された点へ金のリングのマーカーを付けて区別できるようにしました（投票履歴の日付との突き合わせによる表示のみで、記録や計算には触れていません）。いずれも史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.11では、通話まわりと未公開映像の積み残しを仕上げました。「通話の記録」でボイスを再生すると、再生中の行が見える位置まで自動でスクロールするようにし、通話履歴の未解放案内シートからは、思い出画面を開いて対象カードの場所まで進み、金の枠で示す導線を足しました。Mnet Plusのコンテンツタブの「未公開映像」には第2弾として、第11話の企画ゲーム「静寂の中の叫び」の切り抜きカードを第3回生存者発表式の到達で追加しています（裏取りがファン記録の層のため、ファン編集の切り抜きという体裁に留め、史実としては断定していません）。あわせて、マイページの投票履歴の注記に、推移グラフの金のリングとの対応を明記し、履歴とグラフを行き来して辿れるようにしました。いずれも史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.12では、Mnet Plusのコンテンツタブ「未公開映像」の各カードに「公式／ファン編集」の種別ラベルを付け、セクションの凡例とあわせて、公式映像とファン編集の切り抜きの体裁の違いを一覧でも区別できるようにしました。また、未解放の思い出カードの案内シートを汎用化し（従来は通話履歴の案内の中に直書きでした）、通話履歴に加えて順位表の各発表（第1回／第2回／第3回／ファイナル）からも、対応する発表系の思い出カードについて、解放条件の案内と「思い出画面でカードの場所を見る」導線（対象カードまで進み金の枠で示す）を共通で使えるようにしました。あわせて、投票タブの「前回投票」の要約にも、マイページの推定推移グラフの金のリングへの相互参照を小さく入れ、マーカーと履歴の対応をマイページの外からも辿れるようにしました。いずれも表示と導線のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.13では、案内と導線の残りを仕上げました。思い出画面では、ロック中のカード自体もタップできるようにし、その場で解放条件の案内シート（すでに思い出画面にいるため「カードの場所を見る」ボタンを持たない、memGuideSheetの「その場版」）を表示するようにしました。Mnet Plusのコンテンツタブでは、種別ラベルを未公開映像だけでなくステージ映像・個人チッケムの各カードにも広げ、「公式」の表示をタブ全体で統一しました。金のリングの相互参照は双方向になり、マイページの投票履歴と推定推移の各セクション末尾から、投票タブへ戻る小さな導線を付けました（履歴⇔グラフ⇔投票タブの往復が閉じました）。さらに、順位発表の直後（各部のフィナーレのステップにいる間）に限り、ロック画面の先頭に結果通知を出し、タップで対応する発表系の思い出カードへ直結するようにしました（解放判定と案内は既存のrankToMemory／memGuideSheetの仕組みをそのまま使います）。いずれも表示と導線のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.14では、対応と並びの細部を仕上げました。マイページの推定推移リストの行にも、投票した日の行には小さな金ドットを付け、グラフの金のリングとリストの対応を完全一致させました。コンテンツタブ上部の再生プレイヤーのメタ表示（曲名）にも種別ラベル「公式」を付け、再生中の曲まで種別表示が届くようにしました。思い出カードの案内シートには、そのカードの位置（第◯部・その部の◯枚目／全枚数中の通し番号）を小さく併記し、通話履歴・順位表側の汎用案内と思い出画面内のその場版とで文面を揃えました。ロック画面の通知は優先順位を明示しました（発表結果＞未読トーク＞投票リマインダー＞Twitter＞ニュース＞投票完了の確認）。発表直後の結果通知が先頭に入っても、最大4件の枠から最初に落ちるのは情報として最も軽いものになり、まだ投票できる間のリマインダーは落ちなくなりました。いずれも表示と並びのみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.15では、残りの受け皿と文面の細部を仕上げました。推定推移の詳細シートにも、その記録の日が投票した日であれば「この日は投票した日です（グラフでは金のリング、リストでは金ドットで表示）」を併記し、グラフ⇔リスト⇔シートの三者対応をシートの中でも閉じました。画面下部の常駐ミュージックバーの曲名表示にも種別ラベルを付け、公式ステージ曲は「公式」、順位発表BGM（CC-BY音源）は「BGM」と、コンテンツタブの一覧・プレイヤーと同じ読み方でバーの曲名も区別できるようにしました。思い出コレクションでは、解放済みカードの詳細シートにも位置（第◯部・その部の◯枚目／全枚数中の通し番号）を併記し、未解放カードの案内シートと文面・数え方を共通化しました。あわせて軽い整合性監査を行い、全画面の文面を走査して、投票完了画面と裏側サポート配分の見出しに残っていた「見込み」表記を「推定」に統一しました（X／Twitter表記・アプリ名は既に統一済みで、思い出カードとステップの対応にもズレはありませんでした）。いずれも表示と文面のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.16では、種別ラベルの最後の受け皿と、シートと履歴の往復、通知文面の監査を仕上げました。場面内のステージカード（♪曲名表示）の曲名にも種別ラベル「公式」を付け、下部ミュージックバー／コンテンツタブの一覧／再生プレイヤー／場面カードの全経路で種別表示を揃えました。あわせて、ラベル新設で二重になったミュージックバーのサブ行を整理し、種別はタイトル側のラベルに一本化して、サブ行はアーティスト名＋用途＋音源形態（長尺版／iTunesプレビュー）の短縮形だけを表示する役割分担にしました（「公式音源」の表記と、BGMのnote末尾の「BGM」はラベルと重なるため落としています）。推定の記録の詳細シートには、投票日のある記録に「この日の投票履歴を見る ›」を追加し、マイページの投票履歴の該当日の行まで進んで金の枠で示せるようにして、シート⇔履歴の往復を閉じました。さらに、ロック画面の発表直後の結果通知の文面を通しで監査し、発表名を順位表側の見出し（「第◯回 生存者発表式」／「ファイナル順位発表」）に合わせ、順位の言い方も順位表の「大翔の結果：」に揃えました。順位が確定できない回では、従来は順位自体が文面から落ちていましたが、順位表側と同じ「脱落圏」と表記するようにしています。v4.17では表記と導線の仕上げ監査を行いました。推定の記録の詳細シートから投票履歴へ進んだ際の金の枠表示を、対象日に複数の投票行がある場合はその日の全行に広げました。表記のゆれについては、思い出カードのヒント内でステップ題を引く際のステージ名を、カード名・ステップ題と同じ鉤括弧付きの正式形（「本番「VERY NICE」」等）に統一し、それ以外のゆれ（発表式名の題名形は無スペース／見出し・文はスペース入り、トーク題はスレッド名形式、カード固有の別命名など）は、題名としての判断ごとREADMEの対応表に明記して維持しました。ホーム画面のバナーの見出しの発表名も、略記「第◯回発表」から順位表側の正式名「第◯回 生存者発表式」に揃えています（バッジの短いラベルは略記を維持）。曲のノート表記は、場面内のステージカードとコンテンツタブの再生プレイヤーのサブ行も、ミュージックバーと同じ短縮形に統一しました（種別は曲名側のラベルが担うためで、コンテンツタブの映像カードのメタは情報として完全形を残しています）。いずれも表示と導線・文面のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.18では棚卸しを行いました。ニュース記事とツイートの中の発表名の表記を通しで点検し、公式アカウントの角括弧見出しはアプリ内と同じスペース入りの正式名である一方、ニュースの見出し・本文は報道の文体（本文は無スペースの「第◯回生存者発表式」で全記事統一、見出しは短縮形「第◯回生存者発表…」もあり）として意図的に使い分けていることを確認し、その判断をREADMEの対応表に明記しました（ゲーム内の文面自体は変更していません）。あわせて、推定の記録の詳細シートと投票履歴の注記に、投票履歴の保持上限（新しい順に最大20件までで、それより古い投票行は残らないこと）と、金の枠で示されるのは残っている行だけであることを明記しました。思い出カードの題名とSNS側の呼称の対応（「ベスト相方」は完全形「ベスト相方（ベスト 짝꿍）」の日本語部分を採った題名、「静寂の中の叫び」はSNS側の『静寂の中の叫び』の括弧を外した題名）も、対応表の備考に追記しています。また、本ページの版履歴の記述も点検し、現行の実装と食い違う旧表記は「見込み」（現行の「推定」）の1件のみだったため、履歴の文面は残したまま、冒頭に対応の注記を加えました。いずれも注記と文書のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.19では棚卸しを完結させました。場面の場所・日時表示（STEPSのloc、全27件）と人物名鑑の史実欄（CASTのhist、全47件）を通しで点検し、どちらもアプリ内の文・見出しの正式名（スペース入りの「第◯回 生存者発表式」）は使われておらず、無スペースの本文系で揃っていることを確認しました（locの発表名は完全形「第◯回生存者発表式（MC：◯◯）」の3件のみ、histの発表への言及は略記「第◯回順位発表」「第◯回発表」が中心で、完全形も無スペース）。その分類をREADMEの対応表に行として追加し、あわせて対応表全体を「文・見出し／題名／本文・文体」の3分類の小見出しで整理しました（ゲーム内の文面自体は変更していません）。本ページの版履歴は、冒頭と最新の版（v4.16以降）のみを表示し、それより古い版の記述は「これまでの歩み」として折りたたんで保持する形に改めました（文面自体は履歴として、そのまま残しています）。また、Mnet Plusマイページの推定推移グラフの凡例（キャプション）に、リスト側の金ドットの説明を対で入れ、グラフの金のリングとリストの金ドットの相互参照を凡例でも閉じました。いずれも表示と文書のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.20では、設定まわりと文書の仕上げを行いました。設定画面のAbout「これまでの歩み」の折りたたみは、開閉状態をセッション内の変数で保持するようにし、設定画面を開き直しても（再描画されても）開閉が戻らないようにしました（セーブ項目は増やしていません）。あわせて設定画面に「セーブ情報」の要約を新設し、現在の進行（到達した部と今いる場面）、思い出コレクションの収集状況、投票履歴の件数と大翔への累計投票を、既存のセーブデータから読める範囲で表示するようにしました（表示のみで、新しい記録項目は作っていません）。READMEの冒頭には、現行版と主要マイルストーンのみの版履歴の要約を置き、伸びた各版のセクションへの案内にしました。Mnet Plusマイページの推定推移セクション末尾の導線文は、「金のリング／金ドットの日は、投票タブ（투표）で投票できます」と、グラフとリスト両方のマーカーの呼称で対にしました。いずれも表示と文書のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.21では、設定画面の「セーブ情報」の要約を仕上げました。要約パネルの「思い出コレクション」の行末から思い出画面へ、「投票」の行末からMnet Plusのマイページへ進める小さな導線を付け、あわせて、順位が確定している回（heroRank系の値がある回）だけを集めた「これまでの大翔の順位」を小さく併記するようにしました（未確定の回は出さず、確定した回がなければ行自体を出しません。いずれも表示のみで、セーブへの書き込みはありません）。また、再描画で開閉状態が戻ってしまう折りたたみが他にないかを横展開で点検しました。対象になる折りたたみは本ページの「これまでの歩み」の1件のみで、v4.20で開閉保持に対応済みでした。その他の開閉要素は、開いている記事をセーブ内に保持するニュースか、再描画の対象にならない静的DOMの切り替え（トークの検索行・添付パネル）で、いずれも同じ問題は起きません。READMEの要約目次には、末尾に運用ルール（版が上がるたびに「現行版」だけを差し替える）を明記しました。いずれも表示と導線・文書のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.22では、設定画面の「セーブ情報」の要約の導線を全行に揃えました。「これまでの大翔の順位」の各エントリ（第1回／第2回／第3回／ファイナル）から、順位表をその回（rankView）に合わせて開けるようにし、「進行」の行には、今いる場面へ戻る小さな再開リンクを付けました（タイトル画面の「つづきから」ボタンやホームのバナーとは文面・大きさを分けた、行末の小さなリンクです。全編完結後は出しません）。あわせて、要約パネル自体を折りたたみにし、開閉状態をセッション内の変数（saveSumOpen）で保持するようにしました（About「これまでの歩み」の aboutHistOpen と同じ方式で、設定画面を開き直しても開閉が戻りません。セーブ項目は増やしていません）。READMEの要約目次については、v4.21で明記した運用ルールどおり「現行版」の版数と行の差し替えのみで今回の版上げが済むことを、実際にその手順で更新して確認しました。いずれも表示と導線・文書のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.23では、折りたたみと往復の仕上げを行いました。設定画面には折りたたみが2系統あり（About「これまでの歩み」の details と、セーブ情報の要約の表示切り替え）、トグルの文面と矢印の見た目が揃っていなかったため、状態文言「開く ▾／閉じる ▴」とその表示（色・大きさ）を共通の見た目（.fold-state）に統一しました（details 側はブラウザ既定の三角マーカーを消し、開閉状態で文言が切り替わります。開閉状態の保持方式は従来どおりセッション変数で、セーブ項目は増やしていません）。セーブ情報の要約の順位から順位表を開いた場合に限り、順位表の末尾に「設定の要約へ戻る」小さな導線を出し、要約⇔順位表の往復を閉じました（出し分けはセッション内のフラグで、物語側から順位表へ進む経路では出しません）。READMEの表記対応表には、再開リンク3経路（タイトル画面の大きなボタン「つづきから」／ホーム画面の場面名入りバナー／要約の行末リンク「今の場面をひらく」）の文面と役割分担を1行で明記しました。全編完結後の要約では、進行行に再開リンクの代わりにフィナーレの思い出カード「三度目の正直」への導線を出し、完結後の要約も全行に導線が揃いました（開き方は順位表側の発表カードと同じ仕組みです）。いずれも表示と導線・文書のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.24では、要約まわりの往復と完結後の文面の仕上げを行いました。要約の投票行から Mnet Plus マイページへ進んだ場合にも、マイページの末尾に「設定の要約へ戻る」小さな導線を出すようにし、要約⇔マイページの往復を閉じました（順位表側の rankFromSummary と同じ、セッション内フラグによる出し分けです）。完結後の行き先の分担（ホーム画面の完結バナー＝フィナーレ場面の読み返し、要約の進行行＝思い出カードの詳細）は、READMEの表記対応表の再開リンク行に明記しました。完結後の要約のフィナーレ導線の文面は、順位表側の「この発表の思い出カードを開く」とロック画面の結果通知の言い方に合わせ、「フィナーレの思い出カード「三度目の正直」を開く」に統一しています。あわせて、About「これまでの歩み」の開閉復元が、設定画面内の details の先頭要素に依存している前提を、コードコメントとREADMEに恒久的な注意として明記しました。いずれも表示と導線・文書のみで、史実データ・推定の計算式・時系列ゲート・セーブ形式には影響しません。v4.25では、戻り導線の明文化と恒久メモの棚卸し、版履歴の折りたたみ境界の見直しを行いました。READMEの表記対応表には、設定の要約から順位表へ進んだ場合に順位表の末尾に出る戻り導線と、要約からMnet Plusのマイページへ進んだ場合にマイページの末尾に出る戻り導線を、物語への再開リンクとは別系統の行として新設し、どちらも文面は「設定の要約へ戻る ›」であること、出し分けはセッション内のフラグによること、物語
